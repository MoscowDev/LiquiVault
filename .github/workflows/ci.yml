name: Docs

# Code lives in liquivault-contracts, liquivault-sdk, and liquivault-frontend, each with its own CI.
# This repo only holds the overview and shared docs, so CI checks that its links resolve.

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  links:
    name: Check Markdown links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check documentation structure and encoding
        run: node scripts/check-docs.mjs
      - name: Validate recorded appeal evidence
        run: node scripts/check-appeal-gates.mjs
      - name: Test evidence rejection and readiness checks
        run: node --test scripts/check-appeal-gates.test.mjs
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --exclude 'stellar\.expert' --exclude 'localhost' './**/*.md'
          fail: true
